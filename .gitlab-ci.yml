stages:
  - test
  - build
  - push
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ---------- 1. ТЕСТЫ ----------
test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# ---------- 2. СБОРКА ----------
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_SERTDIR: ""
    HEALTHCHECK_TCP_PORT: "2375"
  script:
    - docker build -t $IMAGE_TAG .
    - docker save $IMAGE_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

# ---------- 3. PUSH В REGISTRY ----------
push:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  needs: [build]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker load -i image.tar
    - docker push $IMAGE_TAG
    - docker tag $IMAGE_TAG $IMAGE_LATEST
    - docker push $IMAGE_LATEST
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------- 4. ИМИТАЦИЯ ДЕПЛОЯ ----------
deploy:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  needs: [push]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "== Деплой образа $IMAGE_TAG =="
    - docker pull $IMAGE_TAG
    - docker rm -f demo-app 2>/dev/null || true
    - docker run -d --name demo-app -p 5000:5000 $IMAGE_TAG
    - sleep 5
    - echo "== Контейнер запущен, проверяем healthcheck =="
    - docker ps
    - docker logs demo-app
    - docker exec demo-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health').read().decode())"
  environment:
    name: staging
    url: http://localhost:5000
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


stages:
  - test
  - build
  - push
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    
# ---------- ТЕСТЫ ----------
test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# ---------- СБОРКА (socket-binding, без dind) ----------
build:
  stage: build
  image: docker:27
  script:
    - docker version
    - docker info | grep -A2 "Insecure Registries" || true
    - docker build -t $IMAGE_TAG .
    - docker save $IMAGE_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

# ---------- PUSH В REGISTRY ----------
push:
  stage: push
  image: docker:27
  needs: [build]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker load -i image.tar
    - docker push $IMAGE_TAG
    - docker tag $IMAGE_TAG $IMAGE_LATEST
    - docker push $IMAGE_LATEST
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------- ДЕПЛОЙ (имитация) ----------
deploy:
  stage: deploy
  image: docker:27
  needs: [push]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull $IMAGE_TAG
    - docker rm -f demo-app 2>/dev/null || true
    - docker run -d --name demo-app -p 5000:5000 $IMAGE_TAG
    - sleep 5
    - docker ps
    - docker logs demo-app
    - docker exec demo-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health').read().decode())"
  environment:
    name: staging
    on_stop: stop_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

#---------------- СТОП ДЕПЛОЙ ------------------------
stop_deploy:
  stage: deploy
  image: docker:27
  needs: []
  script:
    - docker rm -f demo-app 2>/dev/null || true
    - echo "demo-app stopped"
  environment:
    name: staging
    action: stop
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

